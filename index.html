<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やることリスト</title>
<style>
  :root {
    --bg: #fdf8f3;
    --card: #ffffff;
    --ink: #3d352e;
    --ink-soft: #8b7f74;
    --line: #ece2d7;
    --accent: #e8875a;
    --accent-soft: #fbeee6;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 6px 24px rgba(61, 53, 46, 0.06);
  }

  h1 {
    margin: 0 0 24px;
    font-size: 26px;
    letter-spacing: 0.02em;
  }

  .row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button:hover { opacity: 0.88; }

  ul {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
  }

  li {
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 17px;
  }

  li:last-child { border-bottom: none; }

  .empty {
    margin-top: 24px;
    padding: 28px 0;
    text-align: center;
    color: var(--ink-soft);
    background: var(--accent-soft);
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1>やることリスト</h1>

    <div class="row">
      <input id="entry" type="text" placeholder="やることを入力">
      <button id="add">追加</button>
    </div>

    <p class="empty" id="empty">まだ何もありません</p>
    <ul id="list"></ul>
  </div>

<script>
  const entry = document.getElementById('entry');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  function refresh() {
    empty.style.display = list.children.length ? 'none' : 'block';
  }

  function addTask(text) {
    const name = text.trim();
    if (!name) return;
    const item = document.createElement('li');
    item.textContent = name;
    list.appendChild(item);
    entry.value = '';
    entry.focus();
    refresh();
  }

  document.getElementById('add').addEventListener('click', () => addTask(entry.value));
  entry.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask(entry.value);
  });

  refresh();
</script>
</body>
</html>
