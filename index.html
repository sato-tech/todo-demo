<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やることリスト</title>
<style>
  :root {
    --bg: #1b1030;
    --card: #2a1a45;
    --ink: #f3e9ff;
    --ink-soft: #a897c4;
    --line: #473066;
    --accent: #ff8a1f;
    --accent-soft: #3a2457;
    --radius: 16px;
  }

  body::before,
  body::after {
    position: fixed;
    top: 24px;
    font-size: 40px;
    pointer-events: none;
    animation: float 4s ease-in-out infinite;
  }
  body::before { content: "🦇"; left: 8%; }
  body::after { content: "👻"; right: 8%; animation-delay: -2s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-14px) rotate(4deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; }
  }

  h1::before { content: "🎃 "; }
  h1::after { content: " 🕸️"; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 0 32px rgba(255, 138, 31, 0.25);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: 0.02em;
  }

  .count {
    margin: 0 0 24px;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--card);
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button:hover { opacity: 0.88; }

  ul {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 17px;
  }

  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }

  li span { flex: 1; }

  li.done span {
    color: var(--ink-soft);
    text-decoration: line-through;
  }

  .remove {
    padding: 4px 10px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
  }

  .remove:hover { color: var(--accent); border-color: var(--accent); }

  .empty {
    margin-top: 24px;
    padding: 28px 0;
    text-align: center;
    color: var(--ink-soft);
    background: var(--accent-soft);
    border-radius: 12px;
  }

  .history {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .history h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: var(--ink-soft);
  }

  .history ul { margin-top: 0; }

  .history li {
    gap: 10px;
    padding: 8px 4px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .history .tag {
    flex: none;
    padding: 1px 8px;
    font-size: 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .history .tag.remove-tag {
    background: var(--line);
    color: var(--ink-soft);
  }

  .history .time { flex: none; font-size: 12px; }

  .history .empty { margin-top: 8px; padding: 14px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="sheet">
    <h1>やることリスト</h1>
    <p class="count" id="count">おわった: 0 / 0</p>

    <div class="row">
      <input id="entry" type="text" placeholder="やることを入力">
      <button id="add">追加</button>
    </div>

    <p class="empty" id="empty">まだ何もありません</p>
    <ul id="list"></ul>

    <section class="history">
      <h2>追加・削除の履歴</h2>
      <p class="empty" id="history-empty">まだ履歴はありません</p>
      <ul id="history-list"></ul>
    </section>
  </div>

<script>
  const STORAGE_KEY = 'todo-demo';

  const entry = document.getElementById('entry');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  const HISTORY_KEY = 'todo-demo-history';
  const HISTORY_MAX = 50;

  const historyList = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');

  let tasks = load(STORAGE_KEY);
  let history = load(HISTORY_KEY);

  function load(key) {
    try {
      return JSON.parse(localStorage.getItem(key)) || [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addHistory(type, name) {
    history.unshift({ type: type, name: name, at: Date.now() });
    history = history.slice(0, HISTORY_MAX);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function formatTime(ms) {
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderHistory() {
    historyList.textContent = '';

    history.forEach((entryItem) => {
      const item = document.createElement('li');

      const tag = document.createElement('span');
      tag.className = entryItem.type === 'add' ? 'tag' : 'tag remove-tag';
      tag.textContent = entryItem.type === 'add' ? '追加' : '削除';

      const label = document.createElement('span');
      label.textContent = entryItem.name;

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(entryItem.at);

      item.append(tag, label, time);
      historyList.appendChild(item);
    });

    historyEmpty.style.display = history.length ? 'none' : 'block';
  }

  function render() {
    list.textContent = '';

    tasks.forEach((task, index) => {
      const item = document.createElement('li');
      if (task.done) item.classList.add('done');

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = task.done;
      check.addEventListener('change', () => {
        tasks[index].done = check.checked;
        save();
        render();
      });

      const label = document.createElement('span');
      label.textContent = task.name;

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '消す';
      remove.addEventListener('click', () => {
        const removed = tasks.splice(index, 1)[0];
        addHistory('remove', removed.name);
        save();
        render();
      });

      item.append(check, label, remove);
      list.appendChild(item);
    });

    const done = tasks.filter((task) => task.done).length;
    count.textContent = 'おわった: ' + done + ' / ' + tasks.length;
    empty.style.display = tasks.length ? 'none' : 'block';
    renderHistory();
  }

  function addTask(text) {
    const name = text.trim();
    if (!name) return;
    tasks.push({ name: name, done: false });
    addHistory('add', name);
    save();
    render();
    entry.value = '';
    entry.focus();
  }

  document.getElementById('add').addEventListener('click', () => addTask(entry.value));
  entry.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask(entry.value);
  });

  render();
</script>
</body>
</html>
