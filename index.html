<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やることリスト</title>
<style>
  :root {
    --bg: #111315;
    --card: #1b1e21;
    --ink: #f4eee7;
    --ink-soft: #a59d96;
    --line: #303438;
    --accent: #ef8b5b;
    --accent-soft: #2d211c;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: radial-gradient(circle at 50% -10%, #25201d 0, var(--bg) 42%);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: 0.02em;
  }

  .count {
    margin: 0 0 24px;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--ink);
    background: #151719;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #1d2022;
  }

  button {
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 600;
    color: #211712;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button:hover { opacity: 0.88; }

  ul {
    list-style: none;
    margin: 24px 0 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 17px;
  }

  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }

  li span { flex: 1; }

  li.done span {
    color: #78736e;
    text-decoration: line-through;
  }

  .remove {
    padding: 4px 10px;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
  }

  .remove:hover { color: var(--accent); border-color: var(--accent); }

  .empty {
    margin-top: 24px;
    padding: 28px 0;
    text-align: center;
    color: var(--ink-soft);
    background: var(--accent-soft);
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1>やることリスト</h1>
    <p class="count" id="count">おわった: 0 / 0</p>

    <div class="row">
      <input id="entry" type="text" placeholder="やることを入力">
      <button id="add">追加</button>
    </div>

    <p class="empty" id="empty">まだ何もありません</p>
    <ul id="list"></ul>
  </div>

<script>
  const STORAGE_KEY = 'todo-demo';

  const entry = document.getElementById('entry');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  let tasks = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    list.textContent = '';

    tasks.forEach((task, index) => {
      const item = document.createElement('li');
      if (task.done) item.classList.add('done');

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = task.done;
      check.addEventListener('change', () => {
        tasks[index].done = check.checked;
        save();
        render();
      });

      const label = document.createElement('span');
      label.textContent = task.name;

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '消す';
      remove.addEventListener('click', () => {
        tasks.splice(index, 1);
        save();
        render();
      });

      item.append(check, label, remove);
      list.appendChild(item);
    });

    const done = tasks.filter((task) => task.done).length;
    count.textContent = 'おわった: ' + done + ' / ' + tasks.length;
    empty.style.display = tasks.length ? 'none' : 'block';
  }

  function addTask(text) {
    const name = text.trim();
    if (!name) return;
    tasks.push({ name: name, done: false });
    save();
    render();
    entry.value = '';
    entry.focus();
  }

  document.getElementById('add').addEventListener('click', () => addTask(entry.value));
  entry.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask(entry.value);
  });

  render();
</script>
</body>
</html>
